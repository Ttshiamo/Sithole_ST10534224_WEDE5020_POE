<!-- Contact -->
<section id="contact">

    <h2>Contact Us</h2>

    <p>
        Have a question or would like to support our work?
        Get in touch with us.
    </p>

    <h3>Hope Community Food Bank</h3>

    <p>
        We are committed to reducing hunger and supporting
        our local community.
    </p>

    <p>
        Email:
        info@hopecommunityfoodbank.org
    </p>

    <p>
        Phone:
        000 000 0000
    </p>

    <p>
        Location:
        Community Food Bank
    </p>

    <h3>Contact Form</h3>

    <form>

        <p>
            <label for="contactName">Name:</label><br>
            <input type="text" id="contactName" name="contactName">
        </p>

        <p>
            <label for="contactEmail">Email:</label><br>
            <input type="email" id="contactEmail" name="contactEmail">
        </p>

        <p>
            <label for="contactMessage">Message:</label><br>

            <textarea id="contactMessage"
                      name="contactMessage"
                      rows="5"
                      cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Send Message">
        </p>

    </form>

</section>

<hr>
